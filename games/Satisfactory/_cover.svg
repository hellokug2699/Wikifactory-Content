<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Satisfactory 缩略图示例">
  <!-- 首页缩略图示例：把本文件替换为你的封面图（或改名为 _cover.png / .jpg 等）即可。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182b4d"/>
      <stop offset="1" stop-color="#0d1626"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7cff"/>
      <stop offset="1" stop-color="#6ee7ff"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <g stroke="#25406e" stroke-width="1.5" opacity="0.7">
    <path d="M0 322 H640"/>
    <path d="M0 356 H640"/>
  </g>
  <g fill="#152642">
    <rect x="48" y="212" width="150" height="110" rx="8"/>
    <rect x="222" y="168" width="126" height="154" rx="8"/>
    <rect x="372" y="232" width="220" height="90" rx="8"/>
  </g>
  <rect x="272" y="118" width="18" height="54" rx="5" fill="#1b2f52"/>
  <g fill="#3d5f99" opacity="0.55">
    <circle cx="281" cy="104" r="11"/>
    <circle cx="294" cy="86" r="14"/>
    <circle cx="312" cy="70" r="17"/>
  </g>
  <g fill="url(#accent)">
    <rect x="70" y="298" width="36" height="18" rx="5"/>
    <rect x="122" y="298" width="36" height="18" rx="5" opacity="0.7"/>
    <rect x="174" y="298" width="36" height="18" rx="5" opacity="0.45"/>
  </g>
  <g transform="translate(470 150)">
    <circle r="48" fill="none" stroke="url(#accent)" stroke-width="11" opacity="0.9"/>
    <circle r="17" fill="url(#accent)"/>
  </g>
</svg>
